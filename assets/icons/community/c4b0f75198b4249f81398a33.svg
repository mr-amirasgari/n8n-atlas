<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" fill="none">
  <ns0:defs>
    
    <ns0:linearGradient id="ecsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <ns0:stop offset="0%" style="stop-color:#1664FF;stop-opacity:1" />
      <ns0:stop offset="100%" style="stop-color:#0D4FDB;stop-opacity:1" />
    </ns0:linearGradient>

    
    <ns0:linearGradient id="serverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <ns0:stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <ns0:stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.85" />
    </ns0:linearGradient>

    
    <ns0:filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <ns0:feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </ns0:filter>

    
    <ns0:filter id="serverShadow" x="-10%" y="-10%" width="120%" height="120%">
      <ns0:feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.2" />
    </ns0:filter>

    
    <ns0:filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <ns0:feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <ns0:feMerge>
        <ns0:feMergeNode in="coloredBlur" />
        <ns0:feMergeNode in="SourceGraphic" />
      </ns0:feMerge>
    </ns0:filter>
  </ns0:defs>

  
  <ns0:rect width="60" height="60" rx="8" fill="url(#ecsGradient)" filter="url(#shadow)" />

  
  <ns0:g filter="url(#serverShadow)">
    <ns0:rect x="12" y="15" width="36" height="8" rx="3" fill="url(#serverGradient)" />
    <ns0:rect x="12" y="26" width="36" height="8" rx="3" fill="url(#serverGradient)" />
    <ns0:rect x="12" y="37" width="36" height="8" rx="3" fill="url(#serverGradient)" />
  </ns0:g>

  
  <ns0:g filter="url(#glow)">
    
    <ns0:circle cx="16" cy="19" r="1.5" fill="#00D4AA" opacity="0.9">
      <ns0:animate attributeName="opacity" values="0.9;0.6;0.9" dur="2s" repeatCount="indefinite" />
    </ns0:circle>
    <ns0:circle cx="20" cy="19" r="1.5" fill="#FF6B6B" opacity="0.8" />

    
    <ns0:circle cx="16" cy="30" r="1.5" fill="#00D4AA" opacity="0.9">
      <ns0:animate attributeName="opacity" values="0.9;0.6;0.9" dur="1.8s" repeatCount="indefinite" />
    </ns0:circle>
    <ns0:circle cx="20" cy="30" r="1.5" fill="#00D4AA" opacity="0.9">
      <ns0:animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.2s" repeatCount="indefinite" />
    </ns0:circle>

    
    <ns0:circle cx="16" cy="41" r="1.5" fill="#00D4AA" opacity="0.9">
      <ns0:animate attributeName="opacity" values="0.9;0.6;0.9" dur="1.5s" repeatCount="indefinite" />
    </ns0:circle>
    <ns0:circle cx="20" cy="41" r="1.5" fill="#00D4AA" opacity="0.9">
      <ns0:animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.5s" repeatCount="indefinite" />
    </ns0:circle>
  </ns0:g>

  
  <ns0:g opacity="0.8">
    <ns0:line x1="26" y1="19" x2="44" y2="19" stroke="white" stroke-width="2" stroke-linecap="round" />
    <ns0:line x1="26" y1="30" x2="44" y2="30" stroke="white" stroke-width="2" stroke-linecap="round" />
    <ns0:line x1="26" y1="41" x2="44" y2="41" stroke="white" stroke-width="2" stroke-linecap="round" />
  </ns0:g>

  
  <ns0:g opacity="0.6">
    <ns0:circle r="1" fill="white">
      <ns0:animateMotion dur="3s" repeatCount="indefinite">
        <ns0:path d="M26,19 L44,19" />
      </ns0:animateMotion>
    </ns0:circle>
    <ns0:circle r="1" fill="white">
      <ns0:animateMotion dur="2.5s" repeatCount="indefinite">
        <ns0:path d="M26,30 L44,30" />
      </ns0:animateMotion>
    </ns0:circle>
    <ns0:circle r="1" fill="white">
      <ns0:animateMotion dur="3.5s" repeatCount="indefinite">
        <ns0:path d="M26,41 L44,41" />
      </ns0:animateMotion>
    </ns0:circle>
  </ns0:g>
</ns0:svg>