<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns1="http://www.w3.org/1999/xlink" viewBox="0 0 40 40">
  <ns0:defs>
    <ns0:filter id="brightness-filter">
      <ns0:feComponentTransfer>
        <ns0:feFuncR type="linear" slope="1.3" intercept="0" />
        <ns0:feFuncG type="linear" slope="1.3" intercept="0" />
        <ns0:feFuncB type="linear" slope="1.3" intercept="0" />
      </ns0:feComponentTransfer>
      <ns0:feColorMatrix type="saturate" values="1.2" />
    </ns0:filter>
  </ns0:defs>
  <ns0:image width="40" height="40" ns1:href="data:image/png;base64," filter="url(#brightness-filter)" />
</ns0:svg>