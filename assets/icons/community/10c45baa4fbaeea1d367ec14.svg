<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="HTML to PDF logo">
  <ns0:defs>
    <ns0:style>
      .label { font: 700 32px/1 'Segoe UI', Roboto, Arial, sans-serif; fill: #ffffff; }
    </ns0:style>
  </ns0:defs>

  
  <ns0:g transform="translate(40,40)">
    <ns0:rect width="160" height="120" rx="16" fill="#0b66ff" />
    <ns0:text x="80" y="80" class="label" text-anchor="middle" dominant-baseline="middle">HTML</ns0:text>
  </ns0:g>

  
  <ns0:g transform="translate(250,100)">
    <ns0:line x1="0" y1="0" x2="90" y2="0" stroke="#0b1220" stroke-width="8" stroke-linecap="round" />
    <ns0:polygon points="90,0 70,-16 70,16" fill="#0b1220" />
  </ns0:g>

  
  <ns0:g transform="translate(380,40)">
    <ns0:rect width="160" height="120" rx="16" fill="#e3342f" />
    <ns0:text x="80" y="80" class="label" text-anchor="middle" dominant-baseline="middle">PDF</ns0:text>
  </ns0:g>
</ns0:svg>