<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <ns0:defs>
    <ns0:linearGradient id="warningBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <ns0:stop offset="0%" style="stop-color:#ffe500; stop-opacity:1" />
      <ns0:stop offset="100%" style="stop-color:#ffb700; stop-opacity:1" />
    </ns0:linearGradient>
    <ns0:linearGradient id="warningHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <ns0:stop offset="0%" style="stop-color:#fff8a8; stop-opacity:1" />
      <ns0:stop offset="100%" style="stop-color:#ffee58; stop-opacity:1" />
    </ns0:linearGradient>
    <ns0:linearGradient id="exclamationFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <ns0:stop offset="0%" style="stop-color:#555555; stop-opacity:1" />
      <ns0:stop offset="100%" style="stop-color:#222222; stop-opacity:1" />
    </ns0:linearGradient>
    <ns0:filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <ns0:feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur" />
      <ns0:feOffset in="blur" dx="4" dy="5" result="offsetBlur" />
      <ns0:feFlood flood-color="#000" flood-opacity="0.4" result="offsetColor" />
      <ns0:feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetBlur" />
      <ns0:feMerge>
        <ns0:feMergeNode in="offsetBlur" />
        <ns0:feMergeNode in="SourceGraphic" />
      </ns0:feMerge>
    </ns0:filter>
  </ns0:defs>

  <ns0:g filter="url(#strongShadow)">
    
    <ns0:polygon points="50,5 97,87 3,87" fill="#e6a800" stroke="#bf8c00" stroke-width="1" stroke-linejoin="round" />
    
    <ns0:polygon points="50,8 94,85 6,85" fill="url(#warningBase)" stroke-linejoin="round" />
    
    <ns0:polygon points="50,11 91,83 9,83" fill="url(#warningHighlight)" stroke-linejoin="round" opacity="0.8" />

    
    <ns0:path d="M47,25 L53,25 L50.5,65 L49.5,65 Z" fill="url(#exclamationFill)" />
    <ns0:circle cx="50" cy="75" r="6" fill="url(#exclamationFill)" />

  </ns0:g>
</ns0:svg>