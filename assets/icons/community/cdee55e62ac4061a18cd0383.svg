<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  
  <ns0:defs>
    <ns0:radialGradient id="glowGrad">
      <ns0:stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <ns0:stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </ns0:radialGradient>
    <ns0:filter id="pulseGlow">
      <ns0:feGaussianBlur stdDeviation="3" result="coloredBlur" />
      <ns0:feMerge>
        <ns0:feMergeNode in="coloredBlur" />
        <ns0:feMergeNode in="SourceGraphic" />
      </ns0:feMerge>
    </ns0:filter>
  </ns0:defs>

  
  <ns0:circle cx="32" cy="32" r="28" fill="url(#glowGrad)" />

  
  <ns0:circle cx="32" cy="32" r="25" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.8" filter="url(#pulseGlow)">
    <ns0:animate attributeName="r" values="25;28;25" dur="2s" repeatCount="indefinite" />
    <ns0:animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" />
  </ns0:circle>

  
  <ns0:rect x="14" y="18" width="36" height="26" rx="3" fill="#1e293b" />

  
  <ns0:path d="M 20 28 L 27 32 L 20 36" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#pulseGlow)">
    <ns0:animate attributeName="stroke" values="#60a5fa;#93c5fd;#60a5fa" dur="1.5s" repeatCount="indefinite" />
  </ns0:path>

  
  <ns0:rect x="31" y="30" width="0" height="4" rx="2" fill="#60a5fa">
    <ns0:animate attributeName="width" values="0;16;16;0" dur="3s" repeatCount="indefinite" />
  </ns0:rect>

  
  <ns0:circle cx="32" cy="32" r="8" fill="#3b82f6" opacity="0.3" filter="url(#pulseGlow)">
    <ns0:animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" />
    <ns0:animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite" />
  </ns0:circle>
</ns0:svg>