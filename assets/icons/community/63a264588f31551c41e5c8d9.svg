<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <ns0:defs>
    <ns0:radialGradient id="doneBgGradient" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
      <ns0:stop offset="0%" style="stop-color:#1af78b; stop-opacity:1" />
      <ns0:stop offset="100%" style="stop-color:#00a354; stop-opacity:1" />
    </ns0:radialGradient>
    <ns0:filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <ns0:feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <ns0:feOffset in="blur" dx="2" dy="3" result="offsetBlur" />
      <ns0:feFlood flood-color="#000" flood-opacity="0.3" result="offsetColor" />
      <ns0:feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetBlur" />
      <ns0:feMerge>
        <ns0:feMergeNode in="offsetBlur" />
        <ns0:feMergeNode in="SourceGraphic" />
      </ns0:feMerge>
    </ns0:filter>
    <ns0:linearGradient id="checkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
       <ns0:stop offset="0%" style="stop-color:#ffffff; stop-opacity:1" />
       <ns0:stop offset="100%" style="stop-color:#e0e0e0; stop-opacity:1" />
    </ns0:linearGradient>
  </ns0:defs>

  <ns0:g filter="url(#dropShadow)">
    <ns0:circle cx="50" cy="50" r="45" fill="url(#doneBgGradient)" />
    
    <ns0:path d="M30 52 L45 67 L75 37" fill="none" stroke="#006432" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <ns0:path d="M30 50 L45 65 L75 35" fill="none" stroke="url(#checkGradient)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </ns0:g>
</ns0:svg>