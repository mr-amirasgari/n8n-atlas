<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc">
  <ns0:title id="title">PII-Redactor security shield</ns0:title>
  <ns0:desc id="desc">Blue split shield with circuits, user, document lines, small central lock and redaction arrow.</ns0:desc>

